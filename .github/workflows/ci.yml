name: CI

# Until now nothing verified a change *before* it merged. The gates existed, but only in
# npm-publish.yml — so lint, types, build and the tests first ran at publish time, on the
# release tag. A break therefore merged cleanly, release-please cut a release, the GitHub
# release published, and only then did the publish job fail: a tagged version that never
# reached npm, needing a fresh commit and release cycle to unwind.
#
# The local husky hook is not a substitute. It runs eslint + tsc --noEmit and does NOT run
# the tests, it is skippable with --no-verify, and a direct push to main bypasses it
# entirely (that is how a dep bump last landed here).
#
# `test` is already `vitest --run`, so it terminates; no watch-mode trap in this repo.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # pnpm version comes from package.json's `packageManager` field; naming it here too
        # raises ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches .tool-versions (nodejs 24.20.0)
          cache: pnpm

      # This repo declares no `link:` overrides, so the committed lockfile resolves as-is
      # and can be frozen — unlike the sibling libraries that link ../factory.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
